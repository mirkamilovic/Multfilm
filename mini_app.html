<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b11">
<title>Luxor Cinema</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1017; --s1:#121a24; --s2:#1a2431; --line:#263344; --tx:#e8eef6; --mu:#8593a6;
  --ac:#86c93a; --acink:#0e1a05; --gold:#f0b94a; --blue:#4a9cff; --red:#ff5b6b; --ok:#3ddc97;
  --r:14px; --tab:62px;
  --ff:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme=light]{
  --bg:#f2f5f8; --s1:#ffffff; --s2:#e9eff5; --line:#d5dfe9; --tx:#111b26; --mu:#5a6b7e;
  --ac:#3f9b1a; --acink:#ffffff; --gold:#b9821a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--ff);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 10px);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}
.hidden{display:none!important}
svg.i{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ---------- SPLASH ---------- */
#fxSplash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#fxSplash.hide{opacity:0;pointer-events:none}
#fxSplash .logo{font-weight:800;font-size:26px;letter-spacing:.02em}
#fxSplash .ring{width:32px;height:32px;margin-top:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- BRAND + SEARCH ---------- */
.brand{display:flex;justify-content:center;align-items:center;position:relative;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:17px;letter-spacing:.01em}
.logo svg{width:22px;height:22px;fill:var(--ac);stroke:none}
.logo span{color:var(--ac)}
.vipb{position:absolute;right:14px;font-size:11px;font-weight:800;padding:6px 11px;border-radius:20px;background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.vipb.on{background:linear-gradient(90deg,#f6d98a,#caa24a);color:#161200;border-color:transparent}
.top{position:sticky;top:0;z-index:30;display:flex;gap:10px;padding:6px 14px 10px;background:var(--bg)}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);flex:none}
.search{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;color:var(--tx)}
.search input::placeholder{color:var(--mu)}

/* ---------- VIEWS ---------- */
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{padding-top:20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:0 14px 11px}
.sec-h h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sec-h button{color:var(--ac);font-size:13px;font-weight:700}
.note{margin:12px 14px 0;padding:11px 13px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;color:var(--mu)}
.gp{font-size:12.5px;color:var(--mu);margin:6px 0 0}
.lbl{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}

/* ---------- CHIPS / SEGMENT ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap}
.chip small{color:var(--mu);font-weight:700;margin-left:4px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.chip.on small{color:var(--acink);opacity:.7}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--acink)}

/* ---------- STORIES ---------- */
.story-tabs{display:flex;justify-content:flex-end;padding:14px 14px 10px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:0 14px 2px;scrollbar-width:none}
.st{flex:0 0 66px;text-align:center}
.st .ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--ac),var(--blue),var(--ac));margin:0 auto}
.st .ring>div{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--bg);position:relative;background:hsl(var(--h) 45% 24%)}
.st img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st span.n{display:block;font-size:10.5px;margin-top:5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- HERO ---------- */
.hero-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 14px;scrollbar-width:none}
.slide{flex:0 0 calc(100% - 28px);scroll-snap-align:center;position:relative;height:236px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:hsl(var(--h) 40% 20%);cursor:pointer}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.slide .fb{position:absolute;inset:0;background:linear-gradient(150deg,hsl(var(--h) 50% 30%),hsl(calc(var(--h) + 40) 45% 12%))}
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,9,14,.94),rgba(5,9,14,.1) 68%)}
.slide .in{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;color:#fff}
.slide .kick{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--ac);text-transform:uppercase}
.slide h3{font-size:21px;line-height:1.15;font-weight:800;margin:5px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .row{display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:11px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:.25s}
.dots i.on{width:22px;background:var(--ac)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:800;font-size:14px;background:var(--ac);color:var(--acink)}
.btn.gh{background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(90deg,#f6d98a,#caa24a);color:#161200}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.btn:active{transform:scale(.97)}

/* ---------- QUICK TILES ---------- */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.qa .ico svg{width:22px;height:22px}
.qa .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.qa button:active{transform:scale(.96)}

/* ---------- GENRE CIRCLES ---------- */
.gen-row{display:flex;gap:12px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.gen{flex:0 0 68px;text-align:center;font-size:11.5px;color:var(--mu);font-weight:600}
.gen .g{width:62px;height:62px;border-radius:19px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 6px;font-size:26px;position:relative}
.gen.none{opacity:.45}
.gen .g b{position:absolute;right:-5px;top:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--ac);color:var(--acink);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.gen:active .g{transform:scale(.95)}

/* ---------- POSTER CARDS ---------- */
.row-h{display:flex;gap:12px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.row-h .card{flex:0 0 132px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px}
.card{position:relative;cursor:pointer;min-width:0}
.card:active .poster{transform:scale(.97)}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:hsl(var(--h) 40% 22%);border:1px solid var(--line);transition:transform .18s}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .fb{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font-weight:800;font-size:13px;color:hsl(var(--h) 80% 90%);background:linear-gradient(160deg,hsl(var(--h) 50% 30%),hsl(calc(var(--h) + 40) 45% 13%))}
.bq{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;z-index:2}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--ac);color:var(--acink);line-height:1.5}
.tag.new{background:linear-gradient(90deg,#ff5f6d,#ff9d6d);color:#fff}
.tag.vip{background:linear-gradient(90deg,#f6d98a,#caa24a);color:#161200}
.tag.price{background:rgba(4,6,10,.7);color:#f6d98a}
.tag.rate{position:absolute;right:6px;top:6px;z-index:2;background:var(--ac)}
.ep{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;font-size:10.5px;font-weight:800;text-align:center;padding:3px 6px;border-radius:7px;background:var(--blue);color:#fff}
.favb{position:absolute;right:6px;bottom:6px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgba(4,6,10,.55);backdrop-filter:blur(6px);color:#fff;font-size:14px;display:grid;place-items:center;transition:transform .2s}
.favb.on{color:var(--red);transform:scale(1.1)}
.cm h4{font-size:13px;font-weight:700;margin-top:8px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm p{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mu);margin-top:3px}
.cm p span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more-card{flex:0 0 132px;aspect-ratio:2/3;border-radius:var(--r);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ac);font-size:12px;font-weight:700;text-align:center;padding:8px}
.empty{grid-column:1/-1;text-align:center;padding:38px 20px;color:var(--mu)}
.empty .e{font-size:40px}
.empty p{font-size:14px;font-weight:700;color:var(--tx);margin-top:8px}
.empty span{font-size:12px;display:block;margin-top:4px}
.sk{aspect-ratio:2/3;border-radius:var(--r);background:var(--s1);position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);animation:shim 1.4s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- TOP 10 ---------- */
.t10{display:flex;gap:4px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.t10 .it{flex:0 0 152px;position:relative;padding-left:34px}
.t10 .n{position:absolute;left:0;bottom:46px;font-weight:800;font-size:78px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--ac);letter-spacing:-.06em}
.t10 .card{width:118px}
.toprow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.toprow:last-child{border-bottom:0}
.toprow .rk{font-size:26px;font-weight:800;width:34px;color:transparent;-webkit-text-stroke:1.5px var(--ac)}
.toprow .th{width:46px;height:64px;border-radius:9px;overflow:hidden;position:relative;background:hsl(var(--h) 40% 22%);flex:none;border:1px solid var(--line)}
.toprow .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.toprow .in{flex:1;min-width:0}
.toprow .in b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow .in span{font-size:11.5px;color:var(--mu)}
.toprow .vw{font-size:12px;color:var(--mu);white-space:nowrap}

/* ---------- COLLECTION / GENERIC CARDS ---------- */
.mon{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 14px 12px}
.mon .lbl{margin-bottom:2px}
.aff{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.aff:last-child{border-bottom:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.stat .n{font-size:19px;font-weight:800;color:var(--ac)}
.stat .l{font-size:11px;color:var(--mu);margin-top:2px}
.inp{width:100%;padding:12px 13px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--tx);font-size:13.5px;margin-top:8px;outline:0}
.inp:focus{border-color:var(--ac)}
.streak{font-size:30px;font-weight:800;color:var(--ac)}

/* profile head */
.phead{display:flex;align-items:center;gap:12px;padding:16px 14px}
.avatar{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--ac),#2a7d16);display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--acink)}
.pname{font-size:16px;font-weight:800}
.psub{font-size:12px;color:var(--mu);margin-top:2px}

/* shop */
.plan{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 14px 10px;gap:10px}
.plan .t{font-size:14px;font-weight:800}
.plan .d{font-size:11.5px;color:var(--mu);margin-top:3px}
.donate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 6px}
.donate button{padding:12px 0;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--gold);font-weight:800;font-size:13px}
.cs{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 14px 10px}
.cs .th{width:56px;height:78px;border-radius:10px;overflow:hidden;position:relative;background:hsl(var(--h) 40% 22%);flex:none}
.cs .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cs .in{flex:1;min-width:0}
.cs .in b{font-size:13.5px}
.cs .in div{font-size:11px;color:var(--mu);margin-top:2px}
.prod{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 14px 10px}
.prod .em{font-size:26px;width:46px;height:46px;border-radius:13px;background:var(--s2);display:grid;place-items:center;flex:none}
.prod .in{flex:1;min-width:0}
.prod .in b{font-size:14px}
.prod .in div{font-size:11.5px;color:var(--mu);margin-top:2px}
.prod .pr{font-size:13px;font-weight:800;color:var(--gold);margin-top:4px}

/* genre subscribe / achievements / continue */
.gsub{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gsub button{padding:7px 12px;border-radius:16px;background:var(--s2);border:1px solid var(--line);color:var(--mu);font-size:12px;font-weight:700}
.gsub button.on{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.achv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.achv div{background:var(--s2);border-radius:12px;padding:10px;text-align:center;opacity:.4}
.achv div.earned{opacity:1;border:1px solid var(--ac)}
.achv .e{font-size:22px}.achv .t{font-size:10.5px;font-weight:700;margin-top:4px}
.cont{display:flex;gap:10px;overflow-x:auto;margin-top:8px}
.cont .cc{flex:0 0 140px;background:var(--s2);border-radius:13px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.cont .cc .ph{height:80px;position:relative;background:hsl(var(--h) 40% 22%)}
.cont .cc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cont .cc .b{padding:8px 9px}.cont .cc .b b{font-size:11.5px;display:block;line-height:1.2}.cont .cc .b span{font-size:10.5px;color:var(--ac);font-weight:700}
.refl{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:10px;font-size:12px;color:var(--mu);word-break:break-all}
.pr-row{display:flex;gap:8px;margin-top:10px}
.pr-row .inp{margin-top:0;text-transform:uppercase}

/* ---------- BOTTOM NAV ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(7,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:9.5px;font-weight:700;color:var(--mu);border-radius:12px;min-width:0;white-space:nowrap}
.nav svg.i{width:21px;height:21px}
.nav button.on{color:var(--ac)}

/* ---------- DRAWER ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);z-index:61;background:var(--s1);border-right:1px solid var(--line);transform:translateX(-103%);transition:transform .25s ease;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px}
.dl{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:left}
.dl.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.dl .chev{margin-left:auto;transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.dsub{display:none;padding:2px 0 8px}
.acc.open .dsub{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dsub button{padding:9px 10px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:left}
.dsep{height:1px;background:var(--line);margin:8px 4px}

/* ---------- SHEET (detail / genres) ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.dhero{position:relative;height:330px;overflow:hidden;background:hsl(var(--h) 40% 18%)}
.dhero .bgi{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(26px) brightness(.55)}
.dhero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,transparent 55%)}
.dhero .pp{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:172px;z-index:2}
.dhero .pp .poster{box-shadow:0 14px 34px rgba(0,0,0,.5)}
.dback{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:5;background:rgba(6,10,15,.55);backdrop-filter:blur(8px);color:#fff;border-color:transparent}
.dbody{padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.dbody h1{font-size:22px;font-weight:800;line-height:1.2;text-align:center}
.dmeta{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:12.5px;color:var(--mu);font-weight:600}

.dgen{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:12px}
.dgen button{padding:6px 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:700}

.dact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

.stars{display:flex;justify-content:center;gap:6px;margin-top:12px}
.stars button{font-size:26px;color:var(--line);line-height:1}
.stars button.on{color:var(--gold)}
.eps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.eps button{padding:11px 0;border-radius:10px;background:var(--s1);border:1px solid var(--line);color:var(--ac);font-weight:800;font-size:12.5px}

.epgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.epitem{display:flex;align-items:center;gap:2px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:2px 2px 2px 12px}
.epitem .epplay{flex:1;background:none;border:none;color:var(--ac);font-weight:800;font-size:12.5px;text-align:left;padding:10px 0}
.epitem .epsend{background:none;border:none;color:var(--mu);padding:10px;border-radius:8px;display:flex;align-items:center}
.epitem .epsend:active{background:var(--line)}
.cmt{margin-top:14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px}
.cmt-row{background:var(--s2);border-radius:10px;padding:8px 10px;margin-top:8px}
.cmt-row b{font-size:11.5px;color:var(--ac)}
.cmt-row p{font-size:12.5px;margin-top:2px;line-height:1.35}
.cmt-in{display:flex;gap:8px;margin-top:10px}
.cmt-in .inp{margin-top:0}
.cmt-in button{width:44px;border-radius:10px;background:var(--ac);color:var(--acink);font-weight:800}

/* genre sheet */
.gs-h{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 14px 6px}
.gs-h h2{font-size:20px;font-weight:800}
.gs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px calc(30px + env(safe-area-inset-bottom))}
.gs-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;font-weight:700;text-align:center}
.gs-grid button .em{font-size:28px}
.gs-grid button small{font-size:11px;color:var(--mu);font-weight:600}
.gs-grid button.has small{color:var(--ac)}
.gs-grid button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--s1))}

/* modal (player / roulette) */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,6,10,.88);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{width:100%;max-width:480px;background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800;font-size:14px}
.mh button{color:var(--mu);font-size:13px;font-weight:700}
.mbox video{width:100%;max-height:70vh;background:#000;display:block}
.rl{padding:8px 16px 18px;text-align:center}
.rl .rt{font-size:20px;font-weight:800;min-height:56px;display:grid;place-items:center;line-height:1.2}
.rl .rg{font-size:13px;color:var(--mu);min-height:20px}

/* fab + toast */
.fab{position:fixed;right:14px;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));z-index:35;width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--acink);display:none;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab.on{display:grid}
#fxToast{position:fixed;left:50%;bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:120;max-width:88vw;text-align:center;pointer-events:none}
#fxToast.show{opacity:1;transform:translate(-50%,0)}
#fxToast.err{background:var(--red);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =====================================================================
   MODERN THEME — zamonaviy ko'rinish (shisha effekt, gradient, suzuvchi menyu)
   ===================================================================== */
:root{
  --bg:#070b11; --s1:#101824; --s2:#172131; --line:#1f2b3c; --tx:#eaf0f8; --mu:#8794a8;
  --ac:#a3e635; --acink:#0b1403;
  --grad:linear-gradient(135deg,#b7f24b 0%,#46d18a 100%);
  --glow:0 8px 22px -6px rgba(163,230,53,.45);
  --shadow:0 12px 30px -14px rgba(0,0,0,.75);
  --r:18px; --tab:80px;
}
[data-theme=light]{
  --bg:#f3f6fb; --s1:#ffffff; --s2:#ebf0f7; --line:#dbe3ee; --tx:#101a28; --mu:#5b6b80;
  --ac:#3f9d12; --acink:#ffffff;
  --grad:linear-gradient(135deg,#5ec41c 0%,#1ea66a 100%);
  --glow:0 8px 20px -6px rgba(46,160,40,.45);
  --shadow:0 10px 26px -16px rgba(30,50,80,.35);
}
html,body{background:var(--bg)}
body{
  background:
    radial-gradient(520px 300px at 92% -40px,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),
    radial-gradient(480px 300px at -8% 120px,rgba(74,156,255,.12),transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
[data-theme=light] body{
  background:
    radial-gradient(520px 300px at 92% -40px,rgba(94,196,28,.14),transparent 70%),
    radial-gradient(480px 300px at -8% 120px,rgba(74,156,255,.10),transparent 70%),
    var(--bg);
  background-attachment:fixed;
}

/* splash */
#fxSplash .logo{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:30px;letter-spacing:.12em;animation:pulse 1.4s ease-in-out infinite}
#fxSplash .ring{border-top-color:var(--ac);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 40%,transparent)}
@keyframes pulse{50%{opacity:.55;transform:scale(.98)}}

/* brand + top bar */
.logo{font-size:18px;letter-spacing:.08em}
.logo svg{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ac) 70%,transparent))}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.vipb{border-radius:99px;padding:6px 12px;backdrop-filter:blur(8px);background:color-mix(in srgb,var(--s1) 80%,transparent)}

.top{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.ibtn,.search{height:46px;border-radius:16px;background:color-mix(in srgb,var(--s1) 88%,transparent);box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.ibtn{width:46px}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
.search input{font-size:14.5px}

/* section headings */
.sec{padding-top:24px}
.sec-h h2{display:flex;align-items:center;gap:9px;font-size:19px;letter-spacing:-.02em}
.sec-h h2::before{content:'';width:4px;height:19px;border-radius:4px;background:var(--grad);box-shadow:0 0 12px color-mix(in srgb,var(--ac) 55%,transparent)}
.sec-h>button{padding:6px 13px;border-radius:99px;background:color-mix(in srgb,var(--ac) 13%,transparent);font-size:12.5px}
.lbl{letter-spacing:.09em}

/* chips + segments */
.chip{border-radius:99px;padding:9px 15px;background:var(--s1);transition:transform .15s,background .2s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--grad);border-color:transparent;box-shadow:var(--glow)}
.seg{border-radius:16px;padding:4px;background:var(--s1)}
.seg button{border-radius:12px;padding:8px 14px;transition:background .2s}
.seg button.on{background:var(--grad);box-shadow:var(--glow)}

/* stories */
.st .ring{box-shadow:0 0 16px -2px color-mix(in srgb,var(--ac) 50%,transparent);background:conic-gradient(from 200deg,var(--ac),var(--blue),#c084fc,var(--ac))}

/* hero */
.slide{height:252px;border-radius:26px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.slide::after{background:linear-gradient(0deg,rgba(4,8,13,.96) 0%,rgba(4,8,13,.55) 38%,rgba(4,8,13,0) 72%)}
.slide .in{left:18px;right:18px;bottom:16px}
.slide .kick{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(163,230,53,.18);backdrop-filter:blur(8px);color:#d4f78c;border:1px solid rgba(163,230,53,.28)}
.slide h3{font-size:24px;letter-spacing:-.02em;margin:9px 0 12px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.dots i.on{background:var(--grad);box-shadow:0 0 10px color-mix(in srgb,var(--ac) 60%,transparent)}

/* buttons */
.btn{height:46px;border-radius:15px;background:var(--grad);box-shadow:var(--glow);letter-spacing:.01em;transition:transform .15s,box-shadow .2s}
.btn.sm{height:38px;border-radius:12px}
.btn.gh{background:var(--s2);box-shadow:none;border-color:var(--line)}
.btn.gold{box-shadow:0 8px 22px -6px rgba(240,185,74,.5)}
.btn:active{transform:scale(.96)}

/* quick tiles */
.qa{gap:11px}
.qa button{border-radius:22px;padding:15px 4px 13px;background:linear-gradient(165deg,var(--s1),color-mix(in srgb,var(--s1) 70%,var(--s2)));box-shadow:var(--shadow);transition:transform .15s}
.qa .ico{width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 32%,transparent),color-mix(in srgb,var(--c) 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 32%,transparent),0 6px 16px -8px var(--c)}
.qa .ico svg{width:23px;height:23px}

/* genre circles */
.gen .g{border-radius:22px;width:64px;height:64px;background:linear-gradient(165deg,var(--s1),var(--s2));box-shadow:var(--shadow)}
.gen .g b{background:var(--grad);box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* posters / cards */
.poster{border-radius:var(--r);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 60%,transparent)}
.poster::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.55) 100%)}
.bq,.tag.rate,.ep,.favb{z-index:2}
.tag{border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.tag.price{background:rgba(6,9,14,.62);backdrop-filter:blur(8px)}
.tag.rate{background:rgba(6,9,14,.62);backdrop-filter:blur(8px);color:#ffd166}
.ep{background:rgba(74,156,255,.82);backdrop-filter:blur(8px);border-radius:9px;bottom:7px;left:7px;right:44px;text-align:left}
.favb{width:32px;height:32px;background:rgba(6,9,14,.5);border:1px solid rgba(255,255,255,.12)}
.favb.on{background:rgba(255,91,107,.22);border-color:rgba(255,91,107,.5)}
.cm h4{font-size:13px;letter-spacing:-.005em}
.more-card{border-radius:var(--r);background:color-mix(in srgb,var(--ac) 7%,transparent);border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
.grid .card,.row-h .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.grid .card:nth-child(2),.row-h .card:nth-child(2){animation-delay:.04s}
.grid .card:nth-child(3),.row-h .card:nth-child(3){animation-delay:.08s}
.grid .card:nth-child(4),.row-h .card:nth-child(4){animation-delay:.12s}
.grid .card:nth-child(5),.row-h .card:nth-child(5){animation-delay:.16s}
.grid .card:nth-child(n+6),.row-h .card:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.sk{border-radius:var(--r)}

/* TOP 10 */
.t10 .n{-webkit-text-stroke:2px var(--ac);filter:drop-shadow(0 0 12px color-mix(in srgb,var(--ac) 45%,transparent))}
.toprow .rk{-webkit-text-stroke:1.5px var(--ac)}
.toprow .th{border-radius:12px}

/* panels */
.mon,.plan,.prod,.cs,.cmt{border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--shadow)}
.stat{border-radius:16px;background:linear-gradient(165deg,var(--s2),color-mix(in srgb,var(--s2) 70%,var(--s1)))}
.stat .n{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:21px}
.inp{border-radius:15px;transition:border-color .2s,box-shadow .2s}
.inp:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}

.streak{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gsub button{border-radius:99px}
.gsub button.on{background:var(--grad);border-color:transparent;box-shadow:var(--glow)}
.achv div{border-radius:14px}
.achv div.earned{border-color:var(--ac);box-shadow:0 0 16px -6px var(--ac)}
.donate button{border-radius:15px;background:linear-gradient(165deg,var(--s1),var(--s2))}
.note{border-radius:16px}

/* floating bottom navigation */
.nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:26px;padding:6px;
  background:color-mix(in srgb,var(--s1) 78%,transparent);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 18px 44px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
[data-theme=light] .nav{box-shadow:0 14px 34px -12px rgba(30,50,80,.35)}
.nav button{position:relative;border-radius:20px;padding:8px 0 7px;transition:color .2s,background .25s,transform .15s}

.nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent)}

.nav button svg{transition:transform .2s,filter .2s}
.fab{background:var(--grad);box-shadow:var(--glow);bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom))}

/* drawer */

.dl{border-radius:16px;transition:background .2s}
.dl.on,.dl:active{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.dsub button{border-radius:12px}

.dhero .pp .poster{border-radius:22px;box-shadow:0 22px 50px -12px rgba(0,0,0,.75)}
.dback{background:rgba(6,10,15,.5);border:1px solid rgba(255,255,255,.14)}
.dbody h1{font-size:24px;letter-spacing:-.02em}
.dgen button{background:color-mix(in srgb,var(--ac) 11%,var(--s1));border-color:color-mix(in srgb,var(--ac) 28%,var(--line))}
.dact2 button{border-radius:18px;background:linear-gradient(165deg,var(--s1),var(--s2));box-shadow:var(--shadow)}
.eps button,.epitem{border-radius:13px}
.stars button.on{filter:drop-shadow(0 0 8px rgba(240,185,74,.7))}
.gs-grid button{border-radius:20px;box-shadow:var(--shadow)}
.gs-grid button.on{box-shadow:0 0 0 1px var(--ac),var(--glow)}

/* modal + toast */
.modal{backdrop-filter:blur(10px)}
.mbox{border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
#fxToast{background:color-mix(in srgb,var(--s1) 92%,transparent);color:var(--tx);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 14px 36px -10px rgba(0,0,0,.7);bottom:calc(var(--tab) + 22px + env(safe-area-inset-bottom))}
#fxToast.err{background:rgba(255,91,107,.92);color:#fff;border-color:transparent}
</style>

function initHero(){
  clearInterval(S.heroTimer);
  var tr=$("heroTrack"); if(!tr||!tr.firstElementChild) return;
  var dots=[].slice.call(document.querySelectorAll("#heroDots i")), n=dots.length;
  function step(){ return tr.firstElementChild.offsetWidth+10; }
  function idx(){ return Math.round(tr.scrollLeft/step()); }
  tr.addEventListener("scroll",function(){ requestAnimationFrame(function(){ var i=idx(); dots.forEach(function(d,k){ d.classList.toggle("on",k===i); }); }); },{passive:true});
  if(n>1&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){
    S.heroTimer=setInterval(function(){ if(document.hidden||S.view!=="home") return; var i=(idx()+1)%n; tr.scrollTo({left:i*step(),behavior:"smooth"}); },5000);
    tr.addEventListener("touchstart",function(){ clearInterval(S.heroTimer); },{passive:true});
  }
}

function loadCatalog(kind,reset){
  var C=S.cat[kind]; if(C.busy&&!reset) return;
  var tok=C.tok=(C.tok||0)+1;
  if(reset){ C.items=[]; C.off=0; C.more=false; }
  C.busy=true;
  var grid=$("cg-"+kind); if(reset&&grid) grid.innerHTML=skelHTML(6);
  var ep=kind==="movies"?"/api/movies-list":"/api/series-list";
  api(ep,{genre:C.genre,q:C.q||"",sort:C.sort,limit:PAGE,offset:C.off}).then(function(r){
    if(tok!==C.tok) return;
    C.busy=false;
    grid=$("cg-"+kind); if(!grid) return;
    if(!r.ok){ grid.innerHTML='<div class="empty"><div class="e">⚠️</div><p>Yuklashda xatolik</p><span>Birozdan so\'ng qayta urinib ko\'ring</span></div>'; return; }
    var list=kind==="movies"?r.movies:r.series;
    remember(list,kind==="movies"?"movie":"series");

  api("/api/create-invoice",{kind:kind,ref:ref}).then(function(r){
    if(!r.ok){ toast(r.message||"Xatolik yuz berdi","err"); return; }
    if(tg&&tg.openInvoice){ tg.openInvoice(r.link,function(st){ if(st==="paid"){ toast("✅ To'lov muvaffaqiyatli!"); loadMe(); } else if(st==="failed") toast("To'lov amalga oshmadi","err"); }); }

/* ====================================================== KINO RULETKA */
function roulette(){
  if(!S.movies.length){ toast("Hozircha kinolar yo'q","err"); return; }
  hap("medium");
  var m=$("modal");
  m.innerHTML='<div class="mbox"><div class="mh"><span>🎲 Kino ruletka</span><button data-act="closeModal">✕ Yopish</button></div><div class="rl"><div class="rt" id="rlT">...</div><div class="rg" id="rlG"></div><div id="rlB" style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px"></div></div></div>';
  m.classList.add("on"); syncBack();
  var done=false, result=null, ticks=0, reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  api("/api/random-movie",{}).then(function(r){ result=(r.ok&&r.movie)?r.movie:S.movies[Math.floor(Math.random()*S.movies.length)]; });
  (function tick(){
    if(!$("rlT")) return;
    ticks++;
    if(ticks>14&&result||ticks>40){ finish(); return; }
    var x=S.movies[Math.floor(Math.random()*S.movies.length)];
    $("rlT").textContent=x.title; $("rlG").textContent=firstGenre(x.genre);
    setTimeout(tick,reduce?10:70+ticks*7);
  })();
  function finish(){
    if(done) return; done=true;
    var r=result||S.movies[0];
    $("rlT").textContent=r.title; $("rlG").textContent=firstGenre(r.genre);
    $("rlB").innerHTML='<button class="btn" data-act="rlOpen" data-arg="'+esc(r.code)+'">Ochish</button><button class="btn gh" data-act="roulette">Yana aylantirish</button>';
    hap("medium");
  }
}

});

$("q").addEventListener("focus",function(){ if(S.view!=="search"&&S.view!=="home") return; });

/* ====================================================== TEMA */
function applyTheme(t){
  S.theme=t; document.documentElement.setAttribute("data-theme",t); store.set("theme",t);
  var c=t==="dark"?"#070b11":"#f3f6fb"; var m=document.querySelector('meta[name=theme-color]'); if(m) m.content=c;
  try{ if(tg){ if(tg.setHeaderColor) tg.setHeaderColor(c); if(tg.setBackgroundColor) tg.setBackgroundColor(c); } }catch(e){}
}

/* ====================================================== MA'LUMOT YUKLASH */
function applyGenres(r){
  S.gen={list:(r.genres&&r.genres.length)?r.genres:FALLBACK_GENRES, icons:r.icons||{}, counts:r.counts||{}, sc:r.series_counts||{}, sub:r.subscribed||[]};
}
function loadMe(){ return api("/api/user-stats",{}).then(function(r){ if(r.ok){ S.me=r; applyVip(); buildDrawer(); } }); }
function loadBulk(){
  var cached=store.get("bulk",null);
  if(cached&&cached.length){ S.movies=cached; remember(cached,"movie"); S.loaded=true; if(S.view==="home") renderHome(); }
  return Promise.all([api("/api/movies-list",{limit:120}),api("/api/series-list",{limit:60})]).then(function(rs){
    S.loaded=true; S.lastLoad=Date.now();
    if(rs[0].ok){ S.movies=rs[0].movies; remember(S.movies,"movie"); store.set("bulk",S.movies.slice(0,30)); S.demo=false; }
    else if(!S.movies.length){ S.demo=false; }
    if(rs[1].ok){ S.series=rs[1].series; remember(S.series,"series"); }
    if(S.view==="home") renderHome();
  });
}
function loadMeta(){
  api("/api/genres-list",{}).then(function(r){ if(r.ok){ applyGenres(r); buildDrawer(); if(S.view==="home") renderHome(); } });
  api("/api/favorites-list",{}).then(function(r){ if(r.ok){ (r.favorites||[]).forEach(function(f){ S.fav[f.code]=true; }); refreshCards(); } });
  api("/api/top-movies",{}).then(function(r){ if(r.ok){ S.top=r.movies; remember(S.top,"movie"); if(S.view==="home") renderHome(); } });
  api("/api/coming-soon-list",{}).then(function(r){ if(r.ok){ S.soon=r.items||[]; if(S.view==="home") renderHome(); } });
  api("/api/referral-info",{}).then(function(r){ if(r.ok) setBot(r.link); });
  api("/api/products-list",{}).then(function(r){ if(r.ok&&r.seller_username) S.seller=r.seller_username; });
  loadMe();
}
